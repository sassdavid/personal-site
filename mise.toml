[tools]
node = "26"

[tasks.check]
alias = "k"
description = "Run the full CI quality gate: types, lint, format, tests"
run = [
  "npm run type-check",
  "npm run lint",
  "npm run format:check",
  "npm test",
]

[tasks.clean]
alias = "c"
description = "Clean all cache, build artifacts, and node_modules"
run = "rm -rf .DS_Store .next .npm .tsbuildinfo .turbo coverage next-env.d.ts node_modules out tsconfig.tsbuildinfo"
