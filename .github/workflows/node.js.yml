name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The single build-matrix leg whose output is deployed. Named once so the
  # Pages-configure gate and the artifact-upload gate cannot drift apart —
  # they are a pair, and a mismatch produces a green CI run with nothing to
  # deploy. Must stay in step with the node version mise.toml pins; the build
  # job asserts that.
  DEPLOY_NODE: '26'
  # Next prints a multi-line telemetry notice on every build otherwise, once per
  # matrix leg, which is pure noise in a log people read to spot real warnings.
  NEXT_TELEMETRY_DISABLED: '1'

# Supersede stale PR runs, but never cancel a main run that may already be
# deploying. The Pages job below serializes main deployments.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Shared job for installing dependencies with caching
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

  # Lint, format, and type check
  code-quality:
    name: Code Quality
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: jdx/mise-action@v4
        with:
          experimental: true

      # The install job's cache is a fast path, not a guarantee. Without the
      # fallback below, an evicted or not-yet-saved entry leaves node_modules
      # empty and every step here fails as "command not found" rather than
      # installing — and `cache-hit` is only true on an exact key match, so a
      # stale prefix hit can never be mistaken for a current one. Restore-only:
      # the install job owns the save, so parallel jobs cannot race on the key.
      - name: Restore node_modules
        id: cache-node-modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'mise.toml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Verify generated share card
        run: npm run og:check

  # Run tests
  test:
    name: Test
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: jdx/mise-action@v4
        with:
          experimental: true

      # Restore-only with an install fallback, as in code-quality above.
      - name: Restore node_modules
        id: cache-node-modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'mise.toml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Build on multiple OS and Node versions
  build:
    name: Build (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: install
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, and the version mise.toml
        # pins for development and the rest of CI.
        node-version: [24, 26]
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          # Reduce matrix size for faster CI. Non-Linux runners only need to
          # prove the build is portable, so they run the deployed version.
          - os: windows-latest
            node-version: 24
          - os: macos-latest
            node-version: 24
    env:
      MISE_NODE_VERSION: ${{ matrix.node-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Install dependencies
        run: npm ci

      # Everything except this job takes its Node from mise.toml, but a matrix
      # needs literals. If the two drift, the deploy leg stops being built and
      # main fails only after CI reports success. Catch it here, on the PR.
      # `mise config get` reads the file directly, so it is unaffected by the
      # MISE_NODE_VERSION override above.
      - name: Check deploy candidate matches mise.toml
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          pinned="$(mise config get tools.node | tr -d 'v[:space:]' | cut -d. -f1)"
          wanted="${DEPLOY_NODE%%.*}"
          if [ "$pinned" != "$wanted" ]; then
            echo "::error file=mise.toml::mise.toml pins Node $pinned but DEPLOY_NODE is $DEPLOY_NODE. Update both, and the build matrix."
            exit 1
          fi
          echo "Deploy candidate Node $wanted matches mise.toml."

      # This matrix entry becomes the deployment candidate on main. Pages
      # configuration has to run before Next builds so repository-site forks
      # receive their basePath in generated links and assets.
      - name: Configure GitHub Pages build
        if: >-
          matrix.os == 'ubuntu-latest' &&
          matrix.node-version == env.DEPLOY_NODE &&
          github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
        with:
          static_site_generator: next

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          NEXT_PUBLIC_GA_TRACKING_ID: ${{ vars.NEXT_PUBLIC_GA_TRACKING_ID }}

      - name: Verify static export
        shell: bash
        run: |
          if [ ! -d "out" ]; then
            echo "Error: 'out' directory not found. Static export may have failed."
            exit 1
          fi
          echo "Static export successful. Found $(find out -type f | wc -l) files."

      # Checks generated HTML/XML itself: leaked drafts, robots, duplicate ids,
      # fragment and route targets, canonical/share metadata, local images, and
      # sitemap/RSS integrity. None of these are visible to component tests.
      - name: Verify export
        run: npm run verify-export

      - name: Upload build artifacts
        if: >-
          matrix.os == 'ubuntu-latest' &&
          matrix.node-version == env.DEPLOY_NODE &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: out/
          include-hidden-files: true
          retention-days: 7

  # Summary job to ensure all checks pass
  ci-success:
    name: CI Success
    needs: [code-quality, test, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check if all jobs succeeded
        run: |
          if [[ "${{ needs.code-quality.result }}" != "success" || 
                "${{ needs.test.result }}" != "success" || 
                "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"

  # Publish exactly the Linux/DEPLOY_NODE artifact that passed the complete CI
  # graph. Manual runs are intentionally deployable only from main.
  deploy:
    name: Deploy to GitHub Pages
    needs: ci-success
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated build
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: out

      - name: Package GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
